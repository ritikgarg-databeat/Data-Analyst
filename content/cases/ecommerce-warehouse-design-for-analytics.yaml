slug: ecommerce-warehouse-design-for-analytics
title: "Case: Designing an Analytics Data Model for Meridian Retail"
category: DATA_ARCHITECTURE
difficulty: INTERMEDIATE

estimated_minutes: 90
company_context: >
  Meridian Retail Co. is a multi-category online retailer that has grown quickly over the past two
  years. Analysts have always queried the raw operational tables directly — orders, order_items,
  products, categories, customers, payments, sessions, and marketing_campaigns — with no
  intermediate analytics layer. As the company has scaled, so has the number of analysts writing
  ad-hoc joins across those same eight tables every day.
stakeholder_name: Priya Shah
stakeholder_role: Head of Data / VP Engineering
problem_statement: >
  "We've outgrown querying the raw tables directly. Two analysts pulled 'monthly revenue' for the
  same month last week and got different numbers — turned out one of them included cancelled
  orders and the other didn't, and neither of them was 'wrong' exactly, they just made different
  assumptions because nothing tells them which one is right. Queries are also getting slower and
  more error-prone as people write their own five- and six-table joins from scratch every time.
  I want a proper analytics data model — fact and dimension tables — so people stop reinventing the
  same joins and the same definitions every time. I don't want a patch; I want this designed
  properly."
business_context: >
  There is currently no dimensional model, no documented definition of "an order" for reporting
  purposes, and no single agreed source of truth for revenue, order counts, or customer counts.
  Every analyst writes their own joins across orders, order_items, products, categories, customers,
  payments, sessions, and marketing_campaigns, and different people make different, undocumented
  choices about which order statuses to include, how to handle a customer or product whose
  attributes change over time, and how to attribute a session to a marketing campaign. The team is
  about to double in size over the next two quarters, which will make inconsistent, ad-hoc queries
  a much bigger problem than it is today.
objective: >
  Design a dimensional (star-schema) model for the ecommerce dataset that gives analysts a single,
  consistent, efficient source for order- and revenue-related reporting, and resolves the
  "what counts as an order" ambiguity explicitly rather than leaving it to each analyst's judgment.
initial_information: >
  The current raw schema has eight tables: orders (order_id, customer_id, order_date, status,
  channel), order_items (order_item_id, order_id, product_id, quantity, unit_price, discount),
  products (product_id, product_name, category_id, unit_price, cost, is_active), categories
  (category_id, category_name, parent_category), customers (customer_id, name fields, email,
  country, signup_date, customer_segment), payments (payment_id, order_id, payment_date, amount,
  payment_method, status), sessions (session_id, customer_id, session_start/end, device,
  landing_page, marketing_campaign_id, converted), and marketing_campaigns (campaign_id,
  campaign_name, channel, start_date, end_date, budget). orders.status takes four values
  (completed, cancelled, refunded, pending); there is no existing documentation of which of those
  should count toward "revenue" versus "order volume" metrics.
constraints:
  - "The model must be built from the existing raw ecommerce tables — no new source systems or fields are available."
  - "It must support both order-level questions (order counts, order status mix) and line-item-level questions (revenue by category or product), since both come up constantly."
  - "It should account for the fact that a product's price/cost or a customer's segment could change over time — the design needs to say what happens to historical reporting when that happens, not just describe the current-state case."
  - "Use the platform's Data Modeler tool to sketch the proposed schema (fact table(s), grain, and dimension tables) as part of the deliverable."
available_datasets:
  - ecommerce
expected_deliverables:
  - "A star-schema sketch (built in the Data Modeler) naming at least one fact table and its exact grain (what one row represents)"
  - "At least three dimension tables, each with a defined key and a short list of the attributes it carries"
  - "An explicit, written definition of which order statuses count toward 'revenue' and which count toward 'order volume' metrics, so future analysts don't have to guess"
  - "A brief explanation of how the model handles a product's price/cost or a customer's segment changing over time, so historical reports stay correct"
learning_objectives:
  - "Translate a normalized operational (OLTP) schema into a dimensional (star-schema) model suited for analytics"
  - "Choose an appropriate fact table grain and justify the choice against the reporting needs described"
  - "Identify dimension tables, their keys, and their attributes from a raw operational schema"
  - "Treat an undocumented business-metric ambiguity (what counts as 'an order') as a first-class data-modeling deliverable, not an afterthought"
  - "Apply slowly-changing-dimension thinking to at least one entity whose attributes change over time"
stages:
  - UNDERSTAND
  - CLARIFY
  - FRAME
  - EXPLORE
  - RECOMMEND
  - COMMUNICATE
  - SUBMIT
