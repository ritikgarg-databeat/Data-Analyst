clarification_guidance:
  - "Asks whether the model needs to support line-item-level analysis (e.g., revenue by category or product) or only order-level reporting, since that determines the fact table's grain"
  - "Asks which order statuses should count toward 'revenue' metrics and which should count toward 'order volume' metrics, rather than assuming an answer"
  - "Asks whether historical point-in-time accuracy matters (e.g., reporting a past order against the customer's segment or product's price/cost AS OF that order date) or only current-state lookups are needed"
  - "Asks who the primary users of the model will be and what kinds of questions they ask most often, to prioritize which dimensions matter most"
rubric:
  - category: "Problem Framing"
    weight: 15
    criteria:
      - criterion: "States, in plain language, an explicit definition of what counts as 'an order' for revenue vs. order-count purposes, before proposing table structures"
        points: 8
      - criterion: "Identifies that the fact table's grain must be decided before dimensions can be chosen, and states the chosen grain explicitly"
        points: 7
  - category: "Modeling Approach"
    weight: 30
    criteria:
      - criterion: "Proposes a coherent fact table (or fact tables) with a clearly stated grain that supports both order-level and line-item-level questions"
        points: 15
      - criterion: "Proposes at least three sensible dimension tables (e.g., customer, product/category, date, channel) with keys and attributes"
        points: 10
      - criterion: "Addresses how the model handles a changing product or customer attribute over time (slowly-changing-dimension reasoning), rather than assuming current-state values are always correct"
        points: 5
  - category: "Technical Analysis"
    weight: 25
    is_technical: true
    criteria:
      - criterion: "Correctly maps each raw table (orders, order_items, products, categories, customers, payments, sessions, marketing_campaigns) to a role in the proposed model (fact, dimension, or bridge/other) with a stated reason"
        points: 15
      - criterion: "The proposed grain and keys are internally consistent (e.g., no double-counting revenue, no orphaned foreign keys) when checked against a few example rows"
        points: 10
  - category: "Deliverable Completeness"
    weight: 15
    criteria:
      - criterion: "Includes a Data Modeler sketch of the fact/dimension structure, not just prose description"
        points: 8
      - criterion: "Includes the explicit order-status-to-metric mapping as a written artifact, not just something implied"
        points: 7
  - category: "Communication"
    weight: 15
    criteria:
      - criterion: "Explains the design in terms the stakeholder (a technical VP, but not necessarily focused on modeling terminology) can evaluate, including why the chosen grain and dimensions solve the specific pain points described"
        points: 15
hints:
  - "Start by writing down, in plain language, exactly what 'one order' means for reporting purposes — does a cancelled order count as an order? Does it count toward revenue? Write the answer down before designing any tables."
  - "Decide your fact table's grain first (one row per order? one row per order line item?) before picking dimensions — almost everything else follows from that one decision."
  - "Look at which raw tables represent things that change over time about an entity (a product's price and cost, a customer's segment) — that's a sign you may need slowly-changing-dimension handling, not just a simple current-state lookup dimension."
  - "Use the platform's Data Modeler to sketch your star schema visually before writing up the final recommendation — it's much easier to catch a missing key or an ambiguous grain visually than in a paragraph."
reference_solution:
  summary: >
    A workable design uses a single core fact table, fact_order_items, at ORDER-LINE-ITEM grain
    (one row per order_items row) — this is the finest grain available in the raw data, and it lets
    analysts roll up to order-level, category-level, or product-level as needed, which a coarser
    order-grain fact table cannot do without losing information. Core dimensions: dim_customer
    (from customers, surrogate key, with slowly-changing handling on customer_segment so a past
    order keeps the segment the customer had AT THE TIME of that order, not their current segment);
    dim_product (from products joined to categories, similarly slowly-changing on unit_price/cost/
    is_active, so historical margin and revenue analysis reflects the price and cost in effect when
    the sale happened, not today's catalog); dim_date (calendar attributes derived from order_date);
    dim_channel (web/mobile/marketplace); and dim_campaign (from marketing_campaigns, nullable FK,
    since sessions and by extension orders are not always attributable to a campaign). The fact
    table carries quantity, unit_price, discount, and an extended_revenue measure
    (quantity*unit_price - discount), plus a foreign key to the parent order's status. Crucially,
    the model makes the order-status ambiguity an explicit, documented attribute rather than
    something buried in every analyst's WHERE clause: "revenue" is defined as
    SUM(extended_revenue) WHERE order_status IN ('completed'), refunded orders are tracked as a
    separate, explicit adjustment rather than silently included or excluded, and "order count" is
    defined separately at the order (not line-item) grain, counted regardless of status unless a
    metric name says otherwise. This directly resolves the "two analysts got different numbers"
    complaint by making the status filter a documented, named business rule instead of an
    unstated assumption in each person's query.
  key_insights:
    - "orders.status has exactly four values (completed, cancelled, refunded, pending) and every one of the 4,205 orders has exactly one — but there is no existing documented rule for which of those four belong in a 'revenue' metric versus an 'order count' metric, which is exactly the kind of undocumented business rule a dimensional model should make explicit rather than leaving to convention."
    - "order_items has no date of its own — order_date lives only on the parent orders table — so a line-item-grain fact table must inherit its date dimension key from the parent order, not from order_items directly."
    - "products.unit_price and products.cost are stored as a single current value per product with no history table; if the catalog is ever updated in place, a naive current-state join would silently rewrite the economics of every past order unless the model captures price/cost history (via slowly-changing dimension versioning or a price-at-time-of-sale value stored on the fact)."
    - "sessions.marketing_campaign_id is nullable, meaning not every session (and therefore not every resulting order) is attributable to a campaign — any campaign dimension must support an explicit 'no campaign' case rather than assuming every fact row has one."
  recommendation: >
    Adopt fact_order_items (line-item grain) as the core fact table, paired with conformed
    dim_customer, dim_product, dim_date, dim_channel, and dim_campaign dimensions, with
    slowly-changing-dimension handling on dim_customer.customer_segment and
    dim_product.unit_price/cost so historical reports stay correct as the catalog and customer base
    evolve. Formally document, alongside the model, exactly which order statuses count toward each
    headline metric (e.g., "net revenue" = completed orders only; refunds tracked as a separate,
    explicit adjustment; "order count" defined at order grain regardless of status unless named
    otherwise) so different teams stop computing divergent numbers from the same underlying tables.
  acceptable_alternatives:
    - "A learner who proposes fact_orders (order-grain) as the primary fact table, paired with a separate, more granular fact_order_items (a 'fact constellation' with two fact tables at different grains), is also a fully valid and common design — full credit as long as the grain of each fact table is stated explicitly and the choice is justified against the reporting needs described."
    - "Combining refunds and cancellations into the fact table via a signed adjustment measure (e.g., a negative net_quantity/net_revenue row) rather than filtering by status downstream is an acceptable alternative design, provided the approach is called out explicitly and still resolves the 'what counts as an order' ambiguity in writing."
version: 1
