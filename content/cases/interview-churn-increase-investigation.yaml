slug: interview-churn-increase-investigation
title: Why Is Monthly Churn Up 3 Points?
category: CUSTOMER_ANALYTICS
difficulty: INTERMEDIATE
estimated_minutes: 30
company_context: Fintrail is a subscription personal-finance app tracked via the saas-product analytics schema.
stakeholder_name: Priya Nair
stakeholder_role: Head of Customer Success
problem_statement: '"Our monthly churn rate jumped from 4% to 7% and I don''t know if this is a blip or something
  serious. Can you find out?"'
business_context: Priya needs to know whether this is a real, sustained increase and what's driving it before deciding
  on any retention program.
objective: Determine whether the churn increase is real and sustained, identify which segment it concentrates in,
  and recommend next steps.
initial_information: 'You have access to the SaaS product schema: users, events, subscriptions, and experiment_assignments.'
constraints:
- Priya needs a real-vs-noise verdict, not just more charts.
- One analysis pass before her next planning meeting.
available_datasets:
- saas-product
expected_deliverables:
- A verified churn rate calculation for the current and prior period
- Segmentation showing where the increase concentrates
- A clear recommendation
learning_objectives:
- Verify a reported metric change before investigating causes
- Segment churn to localize where it's concentrated
- Distinguish a cohort effect from a broad trend
stages:
- CLARIFY
- ANALYZE
- INSIGHTS
- RECOMMEND
- SUBMIT
tags:
- interview
- customer-analytics
- churn
- root-cause
- case-study
skills:
- product-metrics
- root-cause-analysis
- communication
clarification_guidance:
- A good clarifying question confirms the exact churn definition being used (cancellation vs. lapse) and the comparison
  window.
- A good clarifying question asks whether a specific signup cohort or plan tier is driving the increase.
