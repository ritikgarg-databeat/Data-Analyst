slug: ecommerce-revenue-decline-investigation
title: "Case: Why Did Revenue Growth Stall Last Quarter?"
category: BUSINESS_ANALYTICS
difficulty: INTERMEDIATE
estimated_minutes: 75

company_context: >
  Meridian Retail Co. is a multi-category online retailer selling apparel, electronics, home
  goods, and eight other product categories through three channels: its website, its mobile app,
  and a third-party marketplace listing. Revenue has grown quickly over the past two years as the
  company has scaled, and the finance team is now assembling the FY2025 results for the annual
  board meeting.
stakeholder_name: Marcus Whitfield
stakeholder_role: Chief Financial Officer
problem_statement: >
  "I'm putting together the revenue story for the board deck, and one quarter last year just
  doesn't fit the narrative. We grew nicely basically every quarter in 2024 and 2025 — except one,
  where growth basically flatlined before picking back up again the next quarter. I don't want to
  stand up in front of the board and say 'it was a blip, we're not sure why' — I need a real
  explanation. Was it a specific channel? A specific part of the business? Did we lose customers,
  or did something else happen? I don't have a theory yet, and I don't want to guess wrong in
  front of the board."
business_context: >
  The board meeting is in two weeks. Finance reports revenue quarterly, split out by channel (web,
  mobile app, marketplace), and the FY2025 deck compares each quarter to the one before it. Every
  other quarter in the two-year history shows solid double-digit (often triple-digit, early on)
  sequential growth. One quarter breaks that pattern. The CFO does not yet know which channel(s)
  were involved, whether it reflects fewer customers, fewer orders, smaller orders, or something
  else, and has not pre-judged the cause.
objective: >
  Identify precisely which quarter and which part of the business is responsible for the growth
  slowdown, determine what specifically changed (traffic, conversion, order volume, or order
  value), and give the CFO a concrete, defensible explanation to bring to the board.
initial_information: >
  Finance's quarterly revenue view (completed orders only) for the two-year history is available,
  broken out by channel (web, mobile, marketplace). All quarters show strong sequential growth
  except one, where total quarter-over-quarter growth dropped to roughly a seventh of the
  surrounding quarters' pace. The dataset also includes order-level detail (order_items, so order
  count and order value can both be examined), payment records, and website/app session data with
  a conversion flag — so both "did fewer people show up / buy" and "did each purchase shrink"
  questions can be answered from the same data, not just assumed.
constraints:
  - "Only the ecommerce dataset (orders, order_items, products, categories, customers, payments, sessions, marketing_campaigns) is available — no external ad-spend, competitor, or macroeconomic data."
  - "The CFO needs a specific quarter-and-channel-level explanation, not a general statement like 'seasonality' or 'the market was soft that quarter.'"
  - "Distinguish clearly between an absolute revenue decline and a slowdown in the rate of growth — the board will ask which one it was."
available_datasets:
  - ecommerce
expected_deliverables:
  - "A quarterly revenue trend (completed orders, by channel) that pinpoints the specific quarter where growth broke pattern"
  - "A decomposition of that quarter's shortfall into order-count and average-order-value components for the affected channel(s)"
  - "Evidence from session/conversion data ruling in or out a traffic or demand-side explanation"
  - "A specific, evidence-backed explanation the CFO can present to the board, plus a monitoring recommendation going forward"
learning_objectives:
  - "Distinguish a deceleration in growth rate from an absolute revenue decline when reading a time series"
  - "Decompose a revenue anomaly into channel-level and driver-level (order volume vs. order value) components"
  - "Use session and conversion data to rule a demand-side or traffic explanation in or out before concluding it's a pricing/basket effect"
  - "Communicate a data-backed explanation of a single anomalous period to a financial stakeholder under time pressure"
stages:
  - CLARIFY
  - FRAME
  - EXPLORE
  - ANALYZE
  - INSIGHTS
  - RECOMMEND
  - COMMUNICATE
  - SUBMIT
