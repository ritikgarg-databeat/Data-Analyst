slug: ecommerce-margin-compression-analysis
title: "Case: What's Actually Driving Our Margin Below Target?"
category: BUSINESS_ANALYTICS
difficulty: ADVANCED

estimated_minutes: 100
company_context: >
  Meridian Retail Co. is a multi-category online retailer (apparel, electronics, home goods, and
  seven other categories) selling through web, mobile, and marketplace channels. Every product in
  the catalog has a list price and a cost recorded by merchandising, and finance uses those to set
  a target blended gross margin for the business. The company is preparing its quarterly
  profitability report.
stakeholder_name: Marcus Whitfield
stakeholder_role: Head of Finance
problem_statement: >
  "When I average the margin across everything in our product catalog — price versus cost, product
  by product — I get to right around 48%. But when I compute our actual realized gross margin from
  completed orders, weighting by what people actually bought, it's coming in under that, closer to
  47.5-47.7%. That gap might sound small, but at our order volume it's real money, and I need to
  understand it before it gets worse as we scale. Is this just noise, or is something specific
  eating into margin that I should be worried about? I don't have a category or product breakdown
  yet — that's what I need from you."
business_context: >
  Finance's target margin is based on a simple average across the ~150 products in the active
  catalog. The realized, sales-weighted margin has consistently landed a bit below that target for
  as long as anyone has checked, by roughly half a percentage point to a full point depending on
  the period. Nobody has drilled into which categories or products are responsible, or whether the
  gap is stable, worsening, or concentrated in a specific part of the catalog.
objective: >
  Determine whether the gap between catalog-average margin and realized (sales-weighted) margin is
  driven by a broad, structural mix effect, a specific underperforming category, or a specific
  underperforming product — and quantify exactly how much gross profit is at stake.
initial_information: >
  The products table has a list unit_price and a cost for every SKU, and categories groups
  products into 10 categories. order_items records what was actually sold (quantity per line item),
  so a sales-weighted margin can be computed directly. No target margin, budget, or category-level
  benchmark exists elsewhere in the data — only the raw price/cost/quantity fields.
constraints:
  - "Compute gross margin using products.unit_price and products.cost, weighted by order_items.quantity for completed orders — this is the methodology Finance already uses and expects to see reproduced, not a different margin definition."
  - "The Head of Finance wants a specific category or product identified if one exists, not just a restatement of the overall percentage gap."
  - "Some product names in the catalog are reused across different underlying SKUs (different product_id values) — any finding must be traceable to a specific product_id, not just a product name."
available_datasets:
  - ecommerce
expected_deliverables:
  - "Realized gross margin by category, to check whether the gap is broad-based or concentrated"
  - "A time trend of overall realized margin (by quarter) to establish whether it's stable, worsening, or noisy"
  - "A product-level (not just category-level) drill-down identifying which SKU(s), if any, disproportionately drag down the blended margin, combining thin margin with high sales volume"
  - "A quantified estimate of the gross-profit impact of the worst-performing SKU(s), and a specific recommendation"
learning_objectives:
  - "Compute a sales-weighted (realized) margin and distinguish it from a simple unweighted catalog average"
  - "Recognize when a category-level view is too coarse to surface a real problem and drill to the product/SKU level"
  - "Quantify the dollar impact of a specific product's margin gap relative to a blended benchmark, not just report a percentage"
  - "Handle a real data-quality wrinkle (non-unique product names across distinct SKUs) without misattributing a finding"
stages:
  - CLARIFY
  - FRAME
  - EXPLORE
  - ANALYZE
  - VALIDATE
  - INSIGHTS
  - RECOMMEND
  - COMMUNICATE
  - SUBMIT
