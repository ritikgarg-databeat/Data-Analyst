slug: ecommerce-order-data-quality-investigation
title: "Case: Whose Revenue Dashboard Is Right?"
category: DATA_QUALITY
difficulty: INTERMEDIATE

estimated_minutes: 80
company_context: >
  Meridian Retail Co. is a multi-category online retailer selling through web, mobile, and
  marketplace channels. Two different teams each maintain their own revenue dashboard: one built
  by summing recorded payment amounts, and one built by summing order line items. Both dashboards
  are used in different weekly meetings, and both teams believe their number is correct.
stakeholder_name: Jordan Alvarez
stakeholder_role: Analytics Manager
problem_statement: >
  "We have a mess. Team Growth's dashboard sums up payment amounts and reports one revenue number
  for the month. Team Merchandising's dashboard sums up order line items and reports a different,
  higher number for the exact same month. Neither team has changed their query recently, and both
  are adamant they're right. On top of that, someone noticed a large number of orders don't even
  have a matching payment record at all, which is making people even more nervous that the payments
  data is broken. I need to know: which number is actually right, why do they disagree, and is the
  missing-payment thing a real bug or something we should expect? I don't want a guess — I want
  root cause."
business_context: >
  Both dashboards query the same underlying ecommerce database. The gap between them isn't
  identical every month, but it has shown up consistently for as long as anyone has compared the
  two. Nobody has systematically reconciled the two data sources at the row level, and nobody has
  checked whether the "orders with no payment record" observation is actually unusual, or whether
  it's explained by something else in the data (like order status).
objective: >
  Reconcile the two revenue definitions at the row level, quantify exactly how large and how
  consistent the discrepancy is, determine whether the missing-payment-record observation is a
  real defect or an expected pattern, and recommend which data source (or which precise
  definition) should be the source of truth going forward.
initial_information: >
  Team Growth's revenue number comes from summing payments.amount. Team Merchandising's comes from
  summing order_items (quantity times unit_price, minus discount) for completed orders. The gap
  between the two isn't identical for every order, but Team Growth's number has been consistently
  lower than Team Merchandising's for every month anyone has checked. The database also includes
  customers and sessions tables, but neither team's dashboard uses them for this specific
  revenue calculation.
constraints:
  - "Focus the investigation on orders, order_items, and payments — customers and sessions are available but are unlikely to explain a revenue reconciliation gap between these two specific dashboards."
  - "The Analytics Manager wants row-level, evidence-based root cause — not just a restatement that 'the numbers are different.'"
  - "Address the missing-payment-record observation explicitly, even if it turns out not to be the real issue — people are already worried about it and will ask."
available_datasets:
  - ecommerce
expected_deliverables:
  - "A precise count and explanation of orders with no matching payment record, including whether it's explained by order status"
  - "A quantified discrepancy between payments.amount and the order_items-computed total, for orders that DO have a payment record"
  - "A check for whether the discrepancy is concentrated in a specific payment method, channel, or segment, or is broad-based"
  - "A specific recommendation for which revenue definition/source should be treated as correct going forward, and what should happen next"
learning_objectives:
  - "Reconcile two data sources that should represent the same real-world quantity, and quantify a mismatch precisely instead of anecdotally"
  - "Distinguish an expected, explainable data pattern from a genuine data-quality defect using evidence rather than assumption"
  - "Use set-based comparisons (e.g., anti-joins) and row-level, tolerance-based numeric comparisons to isolate a data-quality issue"
  - "Communicate a data-quality root cause with a specific, defensible magnitude rather than a vague 'something's off' statement"
stages:
  - CLARIFY
  - FRAME
  - EXPLORE
  - ANALYZE
  - VALIDATE
  - INSIGHTS
  - RECOMMEND
  - SUBMIT
