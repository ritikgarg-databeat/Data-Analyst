slug: broadcasting
module_slug: numpy-for-analytics
title: Broadcasting
description: How NumPy applies an operation between arrays of different but compatible shapes, and the simple rule that decides when it works.
difficulty: BEGINNER
estimated_minutes: 10
display_order: 6
objectives:
  - Explain what broadcasting does when combining arrays of different shapes
  - State the broadcasting compatibility rule and use it to predict whether an operation will work
  - Apply a 1D array to every row or column of a 2D array using broadcasting
prerequisites: [vectorization]
skills: [pandas]
datasets: []
tags: [python, beginner, foundations]
key_takeaways:
  - "Broadcasting lets NumPy apply an operation between arrays of different shapes by conceptually 'stretching' the smaller one to match, without actually copying data — arr + 5 is broadcasting a single scalar across every element."
  - "The compatibility rule: compare shapes from the rightmost dimension inward — dimensions are compatible if they're equal, or if one of them is 1. If neither holds for some dimension, the operation raises a ValueError."
  - "Broadcasting a (3,) array against a (2, 3) 2D array applies it per column (once per row); broadcasting a (2, 1) array against it applies per row (once per column) — shape placement determines which."
common_mistakes:
  - "Assuming any two arrays can be combined as long as they have 'about the same size' — broadcasting has a precise rule, and shapes that don't satisfy it raise a ValueError rather than silently doing something approximate."
  - "Mixing up whether a 1D array broadcasts down columns or across rows — a (3,) array against a (2, 3) grid lines up with the columns (3 matches the trailing dimension), applying once per row, not once per column."
  - "Forgetting that broadcasting doesn't actually duplicate the smaller array's data in memory — it's a conceptual stretch computed on the fly, which is part of why it's efficient, not a wasteful shortcut."
blocks:
  - type: text
    body: >
      Vectorized operations so far combined arrays of the *same* shape. **Broadcasting** is NumPy's rule
      for what happens when the shapes are different but still compatible — instead of raising an error,
      NumPy conceptually "stretches" the smaller array to match the larger one, without actually copying
      any data.
  - type: heading
    text: "The simplest case: array + scalar"
  - type: text
    body: >
      You've already used broadcasting without necessarily naming it — `prices * 2` broadcasts the
      single scalar `2` across every element of `prices`, as if it were an array the same shape as
      `prices` filled entirely with 2s.
  - type: code
    language: python
    code: |
      import numpy as np

      a = np.array([1, 2, 3])
      a + 5   # array([6, 7, 8])  — 5 is broadcast to every position
    caption: "A scalar broadcasts against an array of any shape"
  - type: heading
    text: "Broadcasting a 1D array against a 2D array"
  - type: text
    body: >
      Broadcasting gets more useful — and more important to understand precisely — once two arrays of
      different shapes are involved. A shape's *position* determines whether it lines up with the
      2D array's columns or its rows.
  - type: code
    language: python
    code: |
      sales = np.array([
          [1, 2, 3],
          [4, 5, 6],
      ])   # shape (2, 3)

      # A (3,) array broadcasts against each ROW — one value per column
      col_adjust = np.array([1, 2, 3])
      sales - col_adjust
      # array([[0, 0, 0],
      #        [3, 3, 3]])

      # A (2, 1) array broadcasts against each COLUMN — one value per row
      row_adjust = np.array([[10], [20]])
      sales + row_adjust
      # array([[11, 12, 13],
      #        [24, 25, 26]])
    caption: "Shape (3,) lines up with sales' 3 columns; shape (2, 1) lines up with its 2 rows"
  - type: heading
    text: The compatibility rule
  - type: text
    body: >
      NumPy decides whether two shapes can broadcast by comparing them dimension by dimension, starting
      from the **rightmost** (trailing) dimension and working inward. Two dimensions are compatible if
      they're equal, **or** if one of them is 1 (a size-1 dimension stretches to match). If every pair of
      compared dimensions satisfies that, the shapes broadcast; if any pair fails it, NumPy raises a
      ValueError instead of guessing.
  - type: table
    headers: ["Shape A", "Shape B", "Compatible?", "Why"]
    rows:
      - ["(2, 3)", "(3,)", "Yes", "Trailing dims: 3 and 3 — equal"]
      - ["(2, 3)", "(2, 1)", "Yes", "Trailing dims: 3 and 1 — one of them is 1, so it stretches"]
      - ["(2, 3)", "(2,)", "No", "Trailing dims: 3 and 2 — neither equal nor 1"]
  - type: code
    language: python
    code: |
      np.array([1, 2, 3]) + np.array([1, 2])
      # ValueError: operands could not be broadcast together with shapes (3,) (2,)
    caption: "Verified — shapes (3,) and (2,) fail the rule, so NumPy refuses rather than guessing"
  - type: callout
    variant: important
    title: Broadcasting foreshadows a lot of pandas
    body: >
      This exact rule is why `dataframe["revenue"] - dataframe["cost"].mean()` works even though a
      single mean is "one value" against a whole column of many — pandas leans on the same NumPy
      broadcasting machinery under the hood. Understanding it here means it won't feel like unexplained
      magic later.
  - type: example
    title: "Normalizing each column of a small dataset"
    body: >
      Subtracting each column's own mean from every value in that column — a common preprocessing step —
      is a one-line broadcast: the column means (shape (3,)) broadcast against every row of the (4, 3)
      data.
    code: |
      data = np.array([
          [10, 100, 1],
          [20, 200, 2],
          [30, 300, 3],
          [40, 400, 4],
      ])

      col_means = data.mean(axis=0)   # shape (3,) — one mean per column
      centered = data - col_means      # broadcasts the (3,) means across all 4 rows

      print(col_means)   # [ 25.  250.    2.5]
    language: python
  - type: question
    prompt: "A (4, 3) array is combined with a (3,) array. Does this broadcast, and if so, how?"
    choices:
      - "No — the shapes don't match, so it raises a ValueError"
      - "Yes — the (3,) array is applied once per row, aligning with the 3 columns"
      - "Yes — the (3,) array is applied once per column, aligning with the 4 rows"
    correct_index: 1
    explanation: >
      Comparing from the trailing dimension: (4, 3) vs (3,) lines up 3 with 3 — equal, so they're
      compatible. The (3,) array is treated as one row of 3 values and applied to every one of the 4
      rows in turn, meaning it effectively provides one value per column, repeated down all 4 rows.

