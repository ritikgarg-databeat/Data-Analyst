slug: polars-vs-pandas-performance
module_slug: polars-for-analysts
title: "Polars vs. Pandas: A Real Timing Comparison and a Decision Framework"
description: A measured, same-data, same-aggregation timing comparison between pandas and Polars, plus a clear framework for when each is the right tool.
difficulty: INTERMEDIATE
estimated_minutes: 12
display_order: 7
objectives:
  - Interpret a real, measured performance comparison between pandas and Polars on the same task
  - Explain the main sources of Polars' speed advantage (multi-threading, no index, Arrow memory, lazy pushdown)
  - Apply a decision framework for choosing pandas vs. Polars on a given real-world task
prerequisites: [polars-reading-parquet]
skills: [pandas]
datasets: [ecommerce]
tags: [python, intermediate, real-world]
key_takeaways:
  - "On this course's small ecommerce dataset (12,627 order_items rows), a real measured groupby-and-aggregate pipeline ran in about 30ms in pandas vs. about 6ms in Polars — Polars was faster, but both are fast enough that the difference is invisible in practice."
  - "On a larger, 2-million-row synthetic version of the same pipeline, pandas took about 0.51s and Polars took about 0.20s (eager) or 0.19s (lazy) — roughly a 2.5x speedup that starts to actually matter when it's one step in a longer pipeline or a job that runs repeatedly."
  - "The gap between pandas and Polars grows with data size, mainly because of multi-threading and lazy pushdown — small data doesn't have enough rows to spread across cores or enough wasted I/O to optimize away."
  - "Most real analyst work — dashboards, one-off reports, ad hoc exploration on data that fits comfortably in memory — is exactly the regime where pandas is fine, and job postings and existing codebases overwhelmingly still ask for pandas specifically."
common_mistakes:
  - "Treating a benchmark number ('Polars is 2.5x faster') as a universal constant — the actual speedup depends heavily on data size, the operation, hardware, and whether lazy pushdown has anything meaningful to optimize away for that particular query."
  - "Rewriting a small, working pandas script in Polars purely because Polars is 'the faster one,' when the runtime difference on that script's actual data is a few milliseconds either way and not worth the switching cost or the smaller ecosystem."
  - "Ignoring Polars entirely because 'pandas is the standard,' even on a pipeline that's provably slow and provably large enough for multi-threading and pushdown to help — the right default is task-dependent, not library-loyalty-dependent."
practical_applications:
  - "Benchmarking a specific slow pipeline step with Python's time module, on real production-sized data, before deciding whether a Polars rewrite is worth the engineering time — rather than assuming based on general reputation."
  - "Explaining, in a technical interview or a team discussion, a concrete, reasoned decision framework for pandas vs. Polars, backed by an actual measured example rather than a vague 'Polars is faster' claim."
interview_questions:
  - question: "When would you recommend a team use Polars instead of pandas?"
    answer: "When the data is large enough, or the pipeline runs often enough, that pandas' single-threaded, eager execution is a real measured bottleneck — not by default. A good answer names concrete signals: a job that's slow enough to notice or complain about, a dataset in the millions of rows, or a pipeline that reads more columns than it uses (where Polars' lazy pushdown pays off). For most everyday analyst work — smaller datasets, one-off exploration, heavy reliance on the pandas ecosystem (seaborn, statsmodels, most tutorials and Stack Overflow answers) — pandas remains the better default."
  - question: "Why does Polars' performance advantage over pandas grow with data size rather than staying constant?"
    answer: "Two of Polars' main advantages — multi-threading and lazy-execution pushdown — need scale to pay off. Splitting work across CPU cores has fixed coordination overhead that isn't worth it on a small DataFrame, and pushdown optimizations (skip unneeded rows/columns) only save meaningful time when there's a meaningful amount of data being skipped. On a small file, both libraries finish quickly enough that these advantages barely register; on a large file, they compound."
resources:
  - title: "Polars User Guide — Coming from pandas"
    url: "https://docs.pola.rs/user-guide/migration/pandas/"
blocks:
  - type: text
    body: >
      Every lesson in this module has claimed, in passing, that Polars is faster than pandas. This
      lesson actually measures it — on our real ecommerce data, and on a larger synthetic dataset built
      to show what happens at scale — and then turns those numbers into a decision framework you can
      actually use.
  - type: heading
    text: "Benchmark 1: the real ecommerce data (small)"
  - type: text
    body: >
      Same task, both libraries: read `order_items.csv` (12,627 rows), compute a per-line revenue
      column, group by `product_id`, and sum. Timed with Python's `time.perf_counter()`, taking the
      minimum of 5 runs to reduce noise from other things happening on the machine.
  - type: code
    language: python
    code: |
      import time
      import pandas as pd
      import polars as pl

      PATH = "data/sample/ecommerce/order_items.csv"

      def pandas_run():
          df = pd.read_csv(PATH)
          df["line_revenue"] = (df["unit_price"] - df["discount"]) * df["quantity"]
          return df.groupby("product_id")["line_revenue"].sum()

      def polars_run():
          df = pl.read_csv(PATH)
          return (
              df.with_columns(((pl.col("unit_price") - pl.col("discount")) * pl.col("quantity")).alias("line_revenue"))
              .group_by("product_id")
              .agg(pl.col("line_revenue").sum())
          )

      pandas_times = []
      for _ in range(5):
          start = time.perf_counter()
          pandas_run()
          pandas_times.append(time.perf_counter() - start)

      polars_times = []
      for _ in range(5):
          start = time.perf_counter()
          polars_run()
          polars_times.append(time.perf_counter() - start)

      print("pandas min (ms):", round(min(pandas_times) * 1000, 2))
      print("polars min (ms):", round(min(polars_times) * 1000, 2))
    caption: Measured on the actual course dataset — read + transform + group + aggregate, both libraries
  - type: output
    body: |
      pandas min (ms): 30.05
      polars min (ms): 5.73
    caption: "Real measured output — Polars was about 5.2x faster here, but both numbers are tiny in absolute terms"
  - type: callout
    variant: important
    title: "5.2x faster, and it doesn't matter"
    body: >
      Both numbers round to "instant" from a human's perspective. Nobody notices the difference between
      a report that takes 30 milliseconds and one that takes 6. This is the central lesson of
      benchmarking on realistic small data: a relative speedup can be large while the absolute impact on
      your actual workday is zero.
  - type: heading
    text: "Benchmark 2: a larger dataset (2 million rows), where it starts to matter"
  - type: text
    body: >
      To see where the gap becomes meaningful, the same style of pipeline was run against a synthetic
      2,000,000-row Parquet file with the same shape as order_items (order_id, product_id,
      category_id, quantity, unit_price, discount) — group by category_id, sum a computed revenue
      column, average quantity, count rows. Three variants were timed: pandas, eager Polars, and lazy
      Polars (`pl.scan_parquet(...).collect()`), each averaged over 5 runs after a warm-up run.
  - type: table
    headers: ["Approach", "Min time (s)", "Avg time (s)", "Speedup vs. pandas (min)"]
    rows:
      - ["pandas (read_parquet + groupby)", "0.506", "0.587", "1.0x (baseline)"]
      - ["Polars eager (read_parquet + group_by)", "0.199", "0.327", "2.54x"]
      - ["Polars lazy (scan_parquet + group_by + collect)", "0.191", "0.436", "2.65x"]
  - type: callout
    variant: tip
    title: What actually produced the speedup here
    body: >
      On 2 million rows, the group_by().agg() step has real work to parallelize across CPU cores, and
      the file read itself benefits from Parquet's columnar layout — both effects that barely register
      on a 12,627-row CSV. This is the honest shape of the tradeoff: Polars' advantage isn't a fixed
      multiplier, it's something that grows with the size and shape of the workload.
  - type: heading
    text: A decision framework
  - type: comparison
    title: "When pandas is fine vs. when Polars is worth reaching for"
    columns: ["Signal", "Favors pandas", "Favors Polars"]
    rows:
      - ["Data size", "Comfortably fits in memory, thousands to low millions of rows", "Many millions of rows, or growing toward that"]
      - ["Runtime today", "Fast enough that nobody has ever complained about it", "A specific, measured pipeline step is a known bottleneck"]
      - ["Ecosystem needs", "Needs seaborn, statsmodels, scikit-learn integration, or a library that only accepts a pandas DataFrame", "Mostly self-contained transformation/aggregation logic"]
      - ["Job market / team norms", "Most job postings and most existing codebases still ask for pandas specifically", "Team is building new, performance-sensitive pipelines from scratch"]
      - ["How often it runs", "One-off exploration, ad hoc analysis", "Scheduled/production pipeline that runs repeatedly, where saved seconds compound"]
  - type: checklist
    title: "Before reaching for Polars over pandas, check:"
    items:
      - "Have I actually measured that pandas is slow here, with something like time.perf_counter(), rather than assuming?"
      - "Is the data large enough (roughly, millions of rows) for multi-threading and pushdown to have real work to do?"
      - "Does this pipeline avoid a hard dependency on a pandas-only library downstream?"
      - "Is this a pipeline that will run repeatedly, where a 2-3x speedup compounds, rather than a one-off script?"
      - "Am I comfortable that the team maintaining this code afterward also knows (or is willing to learn) Polars?"
  - type: callout
    variant: interview_tip
    title: A good interview answer, in one sentence
    body: >
      "I default to pandas because of its ecosystem and because most data I work with fits comfortably
      in memory — I'd reach for Polars specifically when I have a measured, large-data bottleneck where
      its multi-threading and lazy pushdown would actually pay off, not as a blanket replacement." That
      answer is defensible, shows judgment rather than tool-fashion, and matches what this lesson's own
      numbers demonstrate.
  - type: question
    prompt: "In the 2-million-row benchmark, what was the main reason Polars outperformed pandas by a much larger margin than on the small 12,627-row dataset?"
    choices:
      - "Multi-threaded aggregation and (for the lazy version) pushdown have real work to do at that scale — advantages that barely register on a small file"
      - "The 2-million-row file was in CSV format, and CSV always favors Polars"
      - "pandas cannot read files above 1 million rows at all"
    correct_index: 0
    explanation: >
      Polars' core advantages — spreading work across CPU cores and skipping unnecessary reads via
      pushdown — need enough data for the benefits to outweigh their fixed overhead. On a small file
      both libraries finish so quickly the difference is invisible; on a large file, those same
      mechanisms compound into a measurable, meaningful speedup.
