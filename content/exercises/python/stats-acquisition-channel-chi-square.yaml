  - "Build a set of user_ids that have an 'activated' row in `events`, then use `.isin(...)` against that set to create a boolean 'activated' column on a copy of `users`."
  - "`pd.crosstab(col1, col2)` builds the contingency table directly from two columns — pass it straight into `scipy.stats.chi2_contingency`."
solution: |
  ```python
  from scipy.stats import chi2_contingency

  activated_ids = set(events.loc[events.event_name == "activated", "user_id"])
  users2 = users.copy()
  users2["activated"] = users2["user_id"].isin(activated_ids)
  contingency = pd.crosstab(users2["acquisition_channel"], users2["activated"])

  chi2, p_value, dof, expected = chi2_contingency(contingency)
  result = {"chi2": round(chi2, 2), "p_value": p_value, "dof": int(dof)}
  ```
explanation: >
  Activation rates range from 55.9% (paid_social) and 61.7% (paid_search) up to 78.9% (organic) and
  78.2% (referral) — a 23-point spread. The chi-square test confirms this is essentially certain to
  be a real relationship (chi2 = 128.21, p ≈ 9.4e-27, dof = 4), not a coincidence of small samples —
  a clear, actionable signal that paid-acquired users need onboarding attention, or that paid
  channels may be bringing in lower-intent signups in the first place.
