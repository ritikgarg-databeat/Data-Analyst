python_solution_code: |
  import matplotlib.pyplot as plt

  success = payments[payments["status"] == "success"].copy()
  success["month"] = pd.to_datetime(success["payment_date"]).dt.to_period("M").astype(str)
  result = (
      success.groupby("month")["amount"]
      .sum()
      .round(2)
      .reset_index()
      .rename(columns={"amount": "revenue"})
      .sort_values("month")
      .reset_index(drop=True)
  )

  plt.figure(figsize=(10, 5))
  plt.plot(result["month"], result["revenue"], marker="o")
  plt.title("Monthly Revenue Trend")
  plt.xlabel("Month")
  plt.ylabel("Revenue ($)")
  plt.xticks(rotation=45)
  plt.tight_layout()
