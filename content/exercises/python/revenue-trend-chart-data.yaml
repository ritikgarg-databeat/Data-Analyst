hints:
  - "Filter payments to status == 'success' first. pd.to_datetime(...).dt.to_period('M') buckets a date into its calendar month; .astype(str) turns that into a label like '2024-01'."
  - "Group by the month column and sum amount, then sort by month ascending before plotting — plt.plot(result['month'], result['revenue']) needs the x-axis already in chronological order to draw a sensible line."
solution: |
  ```python
  import matplotlib.pyplot as plt

  success = payments[payments["status"] == "success"].copy()
  success["month"] = pd.to_datetime(success["payment_date"]).dt.to_period("M").astype(str)
  result = (
      success.groupby("month")["amount"]
      .sum()
      .round(2)
      .reset_index()
      .rename(columns={"amount": "revenue"})
      .sort_values("month")
      .reset_index(drop=True)
  )

  plt.figure(figsize=(10, 5))
  plt.plot(result["month"], result["revenue"], marker="o")
  plt.title("Monthly Revenue Trend")
  plt.xlabel("Month")
  plt.ylabel("Revenue ($)")
  plt.xticks(rotation=45)
  plt.tight_layout()
  ```
explanation: >
  Filtering to successful payments before bucketing by month is essential — refunded payments
  are still real rows in the table, but including them would overstate revenue actually
  collected. `dt.to_period("M")` is the cleanest way to bucket a date into a calendar month
  without manually extracting year and month and concatenating strings, and sorting
  chronologically before plotting is what makes a line chart actually readable as a trend rather
  than a scrambled zig-zag. Since a fresh sandbox can't inspect a chart drawn in a previous run,
  correctness here is graded on the underlying `result` data — the chart-drawing code is still
  expected as part of a complete, presentable answer.
