python_solution_code: |
  import numpy as np
  from statsmodels.stats.proportion import proportion_effectsize
  from statsmodels.stats.power import NormalIndPower

  co = experiment_assignments[experiment_assignments["experiment_id"] == "checkout_redesign"]
  control = co[co["variant"] == "control"]
  baseline_rate = control["converted"].mean()
  target_rate = baseline_rate * 1.10

  effect_size = proportion_effectsize(target_rate, baseline_rate)
  n_per_group = NormalIndPower().solve_power(
      effect_size=effect_size, alpha=0.05, power=0.80, ratio=1, alternative="two-sided"
  )
  result = int(np.ceil(n_per_group))
python_result_variable: result
python_numeric_tolerance: 2
python_hidden_tests:
  - name: "Required sample size matches a live recomputation"
    code: |
      import numpy as np
      from statsmodels.stats.proportion import proportion_effectsize
      from statsmodels.stats.power import NormalIndPower

      co = experiment_assignments[experiment_assignments["experiment_id"] == "checkout_redesign"]
      control = co[co["variant"] == "control"]
      baseline_rate = control["converted"].mean()
      target_rate = baseline_rate * 1.10
      effect_size = proportion_effectsize(target_rate, baseline_rate)
      n_expected = NormalIndPower().solve_power(
          effect_size=effect_size, alpha=0.05, power=0.80, ratio=1, alternative="two-sided"
      )
      assert abs(result - np.ceil(n_expected)) <= 2, f"Expected roughly {int(np.ceil(n_expected))}, got {result}"
  - name: "Required sample size should be far larger than the real test's actual 1,000 users per group"
    code: |
      assert result > 5000, (
          "checkout_redesign's real observed effect is small relative to its variance — detecting a "
          "10% relative lift over an ~11.3% baseline should require well over 5,000 users per group."
      )
hints:
  - "`proportion_effectsize(prop2, prop1)` from statsmodels converts two raw proportions into Cohen's h effect size, which is what `NormalIndPower` expects — pass the target rate as the first argument and the baseline as the second."
  - "`NormalIndPower().solve_power(effect_size=..., alpha=0.05, power=0.80, ratio=1, alternative='two-sided')` solves for the missing `nobs1` when you don't pass it — that's the per-group sample size."
solution: |
  ```python
  import numpy as np
  from statsmodels.stats.proportion import proportion_effectsize
  from statsmodels.stats.power import NormalIndPower

  co = experiment_assignments[experiment_assignments["experiment_id"] == "checkout_redesign"]
  control = co[co["variant"] == "control"]
  baseline_rate = control["converted"].mean()
  target_rate = baseline_rate * 1.10

  effect_size = proportion_effectsize(target_rate, baseline_rate)
  n_per_group = NormalIndPower().solve_power(
      effect_size=effect_size, alpha=0.05, power=0.80, ratio=1, alternative="two-sided"
  )
  result = int(np.ceil(n_per_group))
  ```
explanation: >
  checkout_redesign's real control conversion rate is 11.3% (113/1,000). Targeting a 10% relative lift
  means detecting a move to about 12.43%. Plugging that effect size into a standard two-proportion power
  calculation at alpha=0.05 (two-sided) and 80% power gives a required sample size of about 12,849 users
  per group — nearly 13 times the 1,000 users per group the real test actually ran with. That gap is
  exactly why the real test's p-value (~0.41) came back non-significant despite showing a promising
  direction: the study never had enough data to reliably detect an effect this size in the first place.
