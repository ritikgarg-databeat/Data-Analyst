slug: dm-ex-case-campaign-model
lesson_slug: dm-modeler-walkthrough-relationships-validate
skill: dimensional-modeling
dataset: ecommerce
title: "Case: Can We Attribute Revenue to Marketing Campaigns?"
description: A rubric-scored case study on designing a dimensional model for campaign performance, honestly confronting a real gap in the ecommerce schema rather than assuming a join key that doesn't exist.
exercise_type: BUSINESS_REASONING
difficulty: ADVANCED
points: 25
tags: [case-study, star-schema, real-world, data-modeling]
business_context: >
  The Head of Marketing wants a dimensional model that reports "revenue generated by each marketing campaign,"
  using the ecommerce dataset's marketing_campaigns and sessions tables alongside the existing orders data.
stakeholder: "Head of Marketing"
constraints:
  - "You only have four tables to work with: marketing_campaigns (campaign_id, campaign_name, channel, start_date, end_date, budget), sessions (session_id, customer_id, session_start, session_end, device, landing_page, marketing_campaign_id, converted), customers, and orders. Neither sessions nor orders has a column linking directly to the other — sessions has no order_id, and orders has no session_id or campaign_id."
  - "sessions.marketing_campaign_id and sessions.customer_id are both nullable — of the 12,000 real sessions in this dataset, only 4,830 (40%) have a campaign attached, only 7,826 (65%) have a known customer, and only 3,179 (26%) have both."
expected_deliverables:
  - "A clear statement of the fact table's proposed grain, and which dimension(s) it connects to"
  - "An honest assessment of whether per-order revenue-to-campaign attribution is actually possible given the real schema gap described above, and what the model can and cannot claim as a result"
  - "A specific recommendation for what to build given that gap, grounded in the real numbers"
  - "A description of what a validator run against the proposed model would and would not flag"
prompt: >
  Using the dimensional-modeling reasoning from this domain's lessons, design (in prose) a dimensional model to
  answer "how much revenue did each marketing campaign generate?" using only marketing_campaigns, sessions,
  customers, and orders. Be explicit about the fact table you'd build, its grain, and its dimensions — and be
  honest about what the real schema does and does not support. Do not assume a join key exists that isn't
  actually in the data.
hints:
  - "Check whether there's any column that connects a session directly to an order, or a campaign directly to an order, before designing the fact table."
  - "A model that can't be built exactly as asked isn't a dead end — the next best model, clearly caveated, plus a recommendation for what upstream tracking change would close the gap, is a legitimate and valuable answer."
rubric:
  - criterion: "Correctly identifies that neither sessions nor orders carries a key linking them directly (no order_id on sessions, no session_id/campaign_id on orders), so true order-level campaign attribution is not supported by the current schema"
    points: 30
  - criterion: "Proposes a legitimate, buildable alternative fact table and grain given the real data (e.g. a session-grain fact — 1 row = 1 session — with dim_campaigns and dim_customers, using the converted flag as a proxy outcome, tracked separately from order revenue rather than joined to it)"
    points: 30
  - criterion: "Uses the real completeness numbers (40% of sessions tied to a campaign, 65% tied to a customer, 26% tied to both) to characterize how partial any campaign-level rollup would be, rather than treating the data as complete"
    points: 25
  - criterion: "Gives a specific, actionable recommendation (e.g. add an order_id or session_id linkage upstream in the OLTP schema before attempting true revenue attribution) rather than only describing the limitation"
    points: 15
solution: >
  The schema does not support true order-level campaign attribution: `sessions` has no `order_id` column and
  `orders` has no `session_id` or `campaign_id` column, so there is no key path connecting a specific order's
  revenue back to the campaign that (maybe) drove it. Any model that pretends otherwise — for instance, joining
  `sessions` to `orders` purely on `customer_id` and a nearby date — would be inventing an attribution rule the
  data doesn't actually support, not reading one out of it.

  The buildable alternative is a session-grain fact table, `fct_sessions` (grain: "1 row = 1 session"), with
  `dim_campaigns` (from marketing_campaigns) and `dim_customers` as its dimensions, plus the session's own
  `converted` flag and `device`/`landing_page` attributes. `fct_sessions.marketing_campaign_id` is a genuine,
  real foreign key to `dim_campaigns.campaign_id` (many sessions, one campaign each — a clean MANY_TO_ONE), and
  `fct_sessions.customer_id` is a genuine foreign key to `dim_customers.customer_id` when present. This
  supports "sessions and conversion rate by campaign," which is real and buildable — it does not support
  "dollars of revenue by campaign," which would require a join the source data doesn't have.

  The real data makes the limitation concrete rather than theoretical: of 12,000 sessions, only 4,830 (40.25%)
  have a `marketing_campaign_id` at all, only 7,826 (65.2%) have a known `customer_id`, and only 3,179 (26.5%)
  have both. Even the weaker claim "conversion rate for campaign-attributed sessions" has to be stated
  carefully — in this dataset campaign-attributed sessions actually convert at 14.3% versus 15.9% for
  non-campaign sessions, a real, slightly counter-intuitive number worth reporting exactly as measured rather
  than assumed.

  A validator run against `fct_sessions` connected to `dim_campaigns` and `dim_customers` would return zero
  findings if `session_id` is marked primary key, grain is filled in, and the two foreign keys correctly
  reference real tables/columns — Validate has no way to know that "revenue by campaign" isn't answerable from
  this model, because that's a business-logic gap, not a structural one; it would validate cleanly regardless.

  Recommendation: report session/conversion metrics by campaign now, using `fct_sessions` as designed above,
  and flag to Marketing and Engineering that true revenue-by-campaign attribution requires an upstream schema
  change — minimally, adding a `session_id` (or `marketing_campaign_id`) column to `orders`, populated at
  checkout time, so a future `fct_orders` can carry a real, direct foreign key to `dim_campaigns` instead of an
  inferred one.
explanation: >
  The strongest answers recognize that "can we build this" is itself a real modeling question, not a given —
  and that inventing a join on customer_id plus a date window to fake an order-to-campaign link would be
  exactly the kind of ungrounded design the validating-a-data-model module warns about, just at the business
  level instead of the structural one. A weaker answer either assumes the join exists, or proposes the correct
  session-grain fact table but doesn't quantify how partial the resulting campaign view actually is using the
  dataset's real completeness numbers.
