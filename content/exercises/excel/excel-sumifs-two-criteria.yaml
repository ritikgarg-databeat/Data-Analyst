excel_solution_sheets:
- name: Data
  cells:
    A1: Region
    B1: Category
    C1: Amount
    A2: West
    B2: Electronics
    C2: '100'
    A3: East
    B3: Electronics
    C3: '150'
    A4: West
    B4: Clothing
    C4: '80'
    A5: East
    B5: Clothing
    C5: '60'
    A6: West
    B6: Electronics
