    B2: =SUMIFS(Data!C2:C9,Data!A2:A9,"West",Data!B2:B9,"Electronics")
excel_check_cells:
- Summary!B2
hints:
- 'SUMIFS takes the sum range FIRST, then pairs of (criteria range, criteria): =SUMIFS(sum_range, range1, crit1,
  range2, crit2, ...).'
- Both conditions must be true for a row to count -- SUMIFS is an AND across all the criteria pairs, unlike stacking
  two separate SUMIFs.
solution: '`=SUMIFS(Data!C2:C9,Data!A2:A9,"West",Data!B2:B9,"Electronics")` evaluates to 220.'
explanation: SUMIFS sums `Data!C2:C9` only where BOTH the matching row in `Data!A2:A9` is "West" AND the matching
  row in `Data!B2:B9` is "Electronics" -- rows 2 and 6 (100 + 120 = 220). Unlike plain SUMIF, SUMIFS supports any
  number of AND'ed conditions.
