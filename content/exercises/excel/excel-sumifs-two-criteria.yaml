slug: excel-sumifs-two-criteria
skill: excel-fundamentals
title: Revenue by Region and Category with SUMIFS
description: The `Data` sheet lists each sale's `Region` (A), `Category` (B), and `Amount` (C). On `Summary`, fill
  in `B2` with a SUMIFS formula that totals `Data!C2:C9` for rows where `Data!A2:A9` is "West" AND `Data!B2:B9`
  is "Electronics".
exercise_type: EXCEL
difficulty: INTERMEDIATE
points: 10
tags:
- excel
- sumifs
business_context: A retailer wants total revenue for one specific region-and-category combination without building
  a whole pivot table.
prompt: The `Data` sheet lists each sale's `Region` (A), `Category` (B), and `Amount` (C). On `Summary`, fill in
  `B2` with a SUMIFS formula that totals `Data!C2:C9` for rows where `Data!A2:A9` is "West" AND `Data!B2:B9` is
  "Electronics".
