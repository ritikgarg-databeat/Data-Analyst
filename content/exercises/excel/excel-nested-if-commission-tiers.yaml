slug: excel-nested-if-commission-tiers
skill: excel-fundamentals
title: Tiered Commission with Nested IF
description: On `Data`, `Sales` is in column A for 3 reps. Fill in `B2:B4` with a nested-IF formula computing commission
  = Sales * (10% if Sales >= 10000, else 7% if Sales >= 5000, else 3%).
exercise_type: EXCEL
difficulty: INTERMEDIATE
points: 10
tags:
- excel
business_context: Sales commission rate depends on which of three sales tiers a rep's monthly sales falls into.
prompt: On `Data`, `Sales` is in column A for 3 reps. Fill in `B2:B4` with a nested-IF formula computing commission
  = Sales * (10% if Sales >= 10000, else 7% if Sales >= 5000, else 3%).
excel_starter_sheets:
- name: Data
  cells:
    A1: Sales
    B1: Commission
    A2: '12000'
    A3: '6000'
    A4: '2000'
excel_solution_sheets:
- name: Data
  cells:
    A1: Sales
    B1: Commission
    A2: '12000'
    A3: '6000'
    A4: '2000'
    B2: =IF(A2>=10000,0.1,IF(A2>=5000,0.07,0.03))*A2
    B3: =IF(A3>=10000,0.1,IF(A3>=5000,0.07,0.03))*A3
    B4: =IF(A4>=10000,0.1,IF(A4>=5000,0.07,0.03))*A4
excel_check_cells:
- Data!B2
- Data!B3
- Data!B4
hints:
- 'Nest the second IF inside the FALSE branch of the first: IF(cond1, result1, IF(cond2, result2, result3)).'
- Check the highest tier first (>=10000) -- if you check the lowest tier first you'd need extra logic to avoid also
  satisfying the higher tiers.
solution: '`=IF(A2>=10000,0.1,IF(A2>=5000,0.07,0.03))*A2` -- 1200 for 12000, 420 for 6000, 60 for 2000.'
explanation: 'Each row picks its rate by checking the highest threshold first: 12000 >= 10000 -> 10% -> 1200; 6000
  is below 10000 but >= 5000 -> 7% -> 420; 2000 is below both -> the else-branch 3% -> 60. Nested IF works well
  for a small, fixed number of tiers like this.'
