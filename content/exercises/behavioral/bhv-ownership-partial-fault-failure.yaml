slug: bhv-ownership-partial-fault-failure
skill: behavioral-interviewing
title: Owning a Failure That Wasn't Entirely Yours
description: Tell me about a project where things went wrong and you had to take responsibility, even
  though part of the failure wasn't your fault.
exercise_type: INTERVIEW_RESPONSE
difficulty: INTERMEDIATE
points: 10
tags:
- behavioral
- star-method
- ownership
prompt: Tell me about a project where things went wrong and you had to take responsibility, even though
  part of the failure wasn't your fault.
hints:
- The STAR framework (Situation, Task, Action, Result) is a useful structure, not a script -- use it to
  make sure you cover what actually happened, in what context, what you personally did, and what came
  of it.
- Interviewers are listening for a specific, real example -- a vague 'sometimes this happens on my team'
  answer is much weaker than one concrete story with real details.
rubric:
- criterion: Describes one specific, real situation rather than a hypothetical or a generic pattern
  points: 25
- criterion: Clearly states the task or goal and the person's own specific role in it
  points: 20
- criterion: Explains concrete actions the person personally took, not just what the team did
  points: 30
- criterion: States a clear, ideally measurable outcome and what was learned from it
  points: 25
solution: 'I delivered a customer segmentation that a marketing campaign was built on, and the campaign
  underperformed badly. Part of the issue was that marketing had used an older snapshot of the segments
  without telling me, but I also hadn''t been explicit enough about how long the segments stayed valid
  for. In the retro, I didn''t focus on assigning blame -- I owned the part that was mine (not documenting
  a freshness window) and proposed a concrete fix: segments would now carry an explicit expiration date
  and marketing would be notified automatically when they went stale.'
explanation: A strong answer here resists the urge to over-explain the other team's mistake and instead
  focuses on the analyst's own controllable contribution and a systemic fix, which reads as accountable
  rather than defensive.
