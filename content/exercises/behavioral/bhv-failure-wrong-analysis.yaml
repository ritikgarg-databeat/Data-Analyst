slug: bhv-failure-wrong-analysis
skill: behavioral-interviewing
title: An Analysis That Turned Out Wrong
description: Tell me about a time an analysis you delivered turned out to be wrong. What happened and
  what did you learn?
exercise_type: INTERVIEW_RESPONSE
difficulty: INTERMEDIATE
points: 10
tags:
- behavioral
- star-method
- failure
prompt: Tell me about a time an analysis you delivered turned out to be wrong. What happened and what
  did you learn?
hints:
- The STAR framework (Situation, Task, Action, Result) is a useful structure, not a script -- use it to
  make sure you cover what actually happened, in what context, what you personally did, and what came
  of it.
- Interviewers are listening for a specific, real example -- a vague 'sometimes this happens on my team'
  answer is much weaker than one concrete story with real details.
rubric:
- criterion: Describes one specific, real situation rather than a hypothetical or a generic pattern
  points: 25
- criterion: Clearly states the task or goal and the person's own specific role in it
  points: 20
- criterion: Explains concrete actions the person personally took, not just what the team did
  points: 30
- criterion: States a clear, ideally measurable outcome and what was learned from it
  points: 25
solution: I reported a strong positive correlation between a marketing channel and revenue, and the team
  shifted budget toward it. A few weeks later we realized the channel's 'conversions' were being double-counted
  due to a tracking bug, and the real effect was much smaller. I flagged it as soon as I found it, corrected
  the number, and helped unwind the budget shift. The lesson I took was to always sanity-check a surprising
  or unusually strong result against a second, independent source before it goes into a decision -- I
  now do a basic magnitude sanity-check on any number that looks 'too good' before presenting it.
explanation: This answer names a real, specific mistake, doesn't minimize the impact, and turns it into
  a concrete change in practice (a sanity-check habit) rather than a vague 'I learned to be more careful.'
