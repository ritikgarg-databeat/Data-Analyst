slug: bhv-conflict-stakeholder-request
skill: behavioral-interviewing
title: Disagreeing With a Stakeholder's Request
description: Tell me about a time you disagreed with a stakeholder's request or interpretation of data.
exercise_type: INTERVIEW_RESPONSE
difficulty: INTERMEDIATE
points: 10
tags:
- behavioral
- star-method
- conflict
prompt: Tell me about a time you disagreed with a stakeholder's request or interpretation of data.
hints:
- The STAR framework (Situation, Task, Action, Result) is a useful structure, not a script -- use it to
  make sure you cover what actually happened, in what context, what you personally did, and what came
  of it.
- Interviewers are listening for a specific, real example -- a vague 'sometimes this happens on my team'
  answer is much weaker than one concrete story with real details.
rubric:
- criterion: Describes one specific, real situation rather than a hypothetical or a generic pattern
  points: 25
- criterion: Clearly states the task or goal and the person's own specific role in it
  points: 20
- criterion: Explains concrete actions the person personally took, not just what the team did
  points: 30
- criterion: States a clear, ideally measurable outcome and what was learned from it
  points: 25
solution: 'A product manager wanted to report a 40% lift from a new onboarding flow, based on comparing
  users who completed the new flow against all users on the old flow. I disagreed with that comparison
  because it only counted people who finished the new flow, ignoring everyone who dropped out partway
  -- a classic survivorship issue. I walked the PM through a side-by-side of both metrics: completion-conditional
  lift (40%) versus intent-to-treat lift across everyone exposed to the new flow (11%). We agreed the
  11% figure was the honest one to report upward, even though it was a much less exciting number.'
explanation: This shows the analyst holding a technical line (survivorship bias) under social pressure
  to report a more flattering number, while still being collaborative -- showing both numbers side by
  side rather than simply refusing, and landing on the correct one together.
