slug: bhv-incomplete-data-messy-question
skill: behavioral-interviewing
title: Working With Messy or Incomplete Data
description: Tell me about a time you had to work with incomplete or messy data to answer a business question.
exercise_type: INTERVIEW_RESPONSE
difficulty: INTERMEDIATE
points: 10
tags:
- behavioral
- star-method
- incomplete-data
prompt: Tell me about a time you had to work with incomplete or messy data to answer a business question.
hints:
- The STAR framework (Situation, Task, Action, Result) is a useful structure, not a script -- use it to
  make sure you cover what actually happened, in what context, what you personally did, and what came
  of it.
- Interviewers are listening for a specific, real example -- a vague 'sometimes this happens on my team'
  answer is much weaker than one concrete story with real details.
rubric:
- criterion: Describes one specific, real situation rather than a hypothetical or a generic pattern
  points: 25
- criterion: Clearly states the task or goal and the person's own specific role in it
  points: 20
- criterion: Explains concrete actions the person personally took, not just what the team did
  points: 30
- criterion: States a clear, ideally measurable outcome and what was learned from it
  points: 25
solution: I was asked for average delivery time, but about 15% of orders were missing a delivery-confirmed
  timestamp entirely. Rather than silently dropping those rows (which could bias the average toward faster
  orders if the missing ones were disproportionately delayed), I first checked whether the missingness
  was random -- it wasn't; it correlated with one specific carrier's data feed. I reported the average
  with that caveat explicitly stated, plus a separate note on the carrier's data gap as its own finding
  worth fixing.
explanation: Checking whether missing data is random before just excluding it, and surfacing the missingness
  itself as a finding, shows real data-quality judgment rather than mechanically computing an average
  on whatever rows happened to be complete.
