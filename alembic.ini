[alembic]
# Migration scripts live under the top-level database/ folder (see project
# structure in README.md) rather than inside apps/api, so migrations are
# clearly app-database-owned infrastructure rather than backend app code.
# This file must stay at the repo root and be run with that as the working
# directory (`alembic upgrade head` from repo root, or via scripts/*) — a
# relative "../.." script_location breaks Mako's template lookup on Windows.
script_location = database/migrations
prepend_sys_path = .

# Timezone-aware, sortable revision filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

version_path_separator = os

# sqlalchemy.url is intentionally omitted here — env.py reads DATABASE_URL
# from app.core.config.get_settings() so migrations always target whatever
# environment (.env / docker-compose / CI) is currently active.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
